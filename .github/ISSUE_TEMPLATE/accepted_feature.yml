name: 📋 Feature Specification (Maintainers / Approved Backlog)
description: Specify an accepted feature or internal team initiative for the backlog.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        ### 📌 Feature Specification
        This form is for specifying scoped features entering the engineering backlog.
        - **Community suggestions**: Please pitch new ideas in [GitHub Discussions](https://github.com/TheEditorX/wme-closures-plus/discussions/new?category=ideas) first.
        - **Team initiatives**: Can be authored directly by maintainers without a prior discussion.
  - type: input
    id: discussion
    attributes:
      label: Original Discussion (Optional)
      description: Link to the GitHub Discussion if originated from one. Leave blank for internal initiatives.
      placeholder: "https://github.com/TheEditorX/wme-closures-plus/discussions/... (or leave blank)"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / User Story
      description: What problem does this feature solve, and for whom?
      placeholder: "As a [user type], I want to [action] so that [benefit]..."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What testable criteria must be met for this feature to be considered complete?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
        - [ ] Criteria 3
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Proposed Technical Solution & Scope
      description: Architectural notes, affected components, files, or APIs.
      placeholder: "Affected components, proposed changes, edge cases..."
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/TheEditorX/wme-closures-plus/blob/dev/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
